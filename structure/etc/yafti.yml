title: "NintenDeck Setup"
properties:
  mode: "run-once"

screens:
  welcome:
    source: yafti.screen.title
    values:
      title: "NintenDeck Setup"
      description: "This setup will install necessary components to run the OS"
      show_head: true

  first_step:
    source: yafti.screen.package
    values:
      title: "Configuration"
      show_head: true
      package_manager: yafti.plugin.run
      groups:
        Base System:
          title: "Base System"
          default: true
          required: true
          packages:
            - "Steam Launcher": "/usr/bin/install-deck.sh"
            - "DeckyLoader": ""
            - "Dependencies": ""

        Extras:
          title: "Extras"
          default: false
          packages:
            - ";aeiorgh;sep0r": ""

  finished:
    source: yafti.screen.title
    values:
      title: "All Done!"
      description: "Setup is complete. You can close this window."
      icon: "emblem-ok-symbolic"
      show_head: true
